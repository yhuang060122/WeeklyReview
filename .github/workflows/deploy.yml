name: Deploy to GitHub Pages

# 推送 / 合并到 main 分支时自动部署；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只运行一次部署，避免并发冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 只把站点内容（各分类目录 + 根目录 index.html/favicon/.nojekyll）放进 public/，
      # 排除版本控制与构建脚本等非站点文件
      - name: Stage static site
        run: |
          mkdir -p public
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.idea/' \
            --exclude='.workbuddy/' \
            --exclude='scripts/' \
            --exclude='README.md' \
            --exclude='*.py' \
            ./ public/

      # 从 HTML 提取 <title> 生成目录元数据，index.html 靠它动态渲染
      - name: Generate manifest.json
        run: python3 scripts/generate_manifest.py public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
