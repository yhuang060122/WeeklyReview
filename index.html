<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeeklyReview 档案库</title>
<link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  :root {
    --bg: #0f1419;
    --bg-soft: #151b23;
    --card: #1a212b;
    --card-hover: #202a37;
    --border: #26303e;
    --text: #e8edf4;
    --text-dim: #9aa7b8;
    --accent: #2dd4bf;
    --accent-soft: #134e4a;
    --amber: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(45, 212, 191, 0.08), transparent 60%),
      radial-gradient(900px 400px at 10% -10%, rgba(245, 158, 11, 0.06), transparent 55%),
      var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 24px 40px; }

  header { margin-bottom: 40px; }
  header .kicker {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--accent);
    border: 1px solid var(--accent-soft);
    background: rgba(45, 212, 191, 0.08);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  header h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.02em; }
  header p.sub { margin-top: 10px; color: var(--text-dim); max-width: 680px; font-size: 15px; }

  section { margin-bottom: 40px; }
  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 20px;
  }
  .sec-head h2 { font-size: 19px; font-weight: 600; }
  .sec-head .count { font-size: 13px; color: var(--text-dim); }

  /* 学习笔记内部的子类小节标题 */
  .subhead {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 26px 0 12px;
    padding-left: 10px;
    border-left: 3px solid var(--accent-soft);
  }
  .sec-head + .subhead { margin-top: 2px; }
  .subhead h3 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  .subhead .count { font-size: 12px; color: var(--text-dim); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px 16px;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    background: var(--card-hover);
    border-color: rgba(45, 212, 191, 0.45);
  }
  .card .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tag {
    font-size: 12px;
    color: var(--accent);
    background: rgba(45, 212, 191, 0.10);
    border: 1px solid var(--accent-soft);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .tag.amber { color: var(--amber); background: rgba(245, 158, 11, 0.10); border-color: rgba(245, 158, 11, 0.30); }
  .date { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
  .card .go { font-size: 13px; color: var(--accent); font-weight: 500; }
  .card:hover .go::after { content: " →"; }

  .err {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 18px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .err a { color: var(--accent); }

  footer {
    border-top: 1px solid var(--border);
    padding-top: 18px;
    color: var(--text-dim);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    justify-content: space-between;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    .wrap { padding: 32px 16px 28px; }
    header h1 { font-size: 27px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="kicker">GITHUB PAGES · AUTOMATED</span>
    <h1>WeeklyReview 档案库</h1>
    <p class="sub">周复盘看板与学习笔记的静态档案，按主题分目录归档。目录由 <code>manifest.json</code> 动态生成——把新文件放进对应文件夹并推送 main 分支，GitHub Actions 自动提取标题并重建本页。</p>
  </header>

  <main id="content"></main>

  <footer>
    <span>由 GitHub Actions 自动部署 · 目录自动生成，无需手工维护</span>
    <a href="https://github.com/yhuang060122/WeeklyReview">github.com/yhuang060122/WeeklyReview</a>
  </footer>

</div>

<script>
// 动态目录：读取构建时生成的 manifest.json，按分类渲染卡片
// 学习笔记在分类内部再按子类（AI / 前端 / 后端 / 其他）分组
const SECTIONS = {
  guide:  { title: "📖 使用指南" },
  weekly: { title: "📊 周复盘系列" },
  note:   { title: "🧠 学习笔记" },
};

const NOTE_ORDER = ["AI", "前端", "后端", "其他"];

function tagClass(tag) {
  return (tag === "周复盘" || tag === "常驻模块") ? "tag" : "tag amber";
}

function ctaFor(tag) {
  if (tag === "周复盘" || tag === "常驻模块") return "打开看板";
  return tag === "使用指南" ? "查看指南" : "阅读笔记";
}

function makeCard(it, showTag) {
  const card = document.createElement("a");
  card.className = "card";
  card.href = encodeURI(it.path); // 相对路径，如 weekly/2026-11-02_2026-11-08.html

  const tagHtml = showTag
    ? '<span class="' + tagClass(it.tag) + '">' + it.tag + "</span>"
    : "";
  const dateHtml = it.label ? '<span class="date">' + it.label + "</span>" : "";
  // 子类分组里标签已由小标题承担，避免同一信息重复两次
  const metaHtml = (tagHtml || dateHtml)
    ? '<div class="meta">' + tagHtml + dateHtml + "</div>"
    : "";

  card.innerHTML =
    metaHtml +
    "<h3></h3>" +
    '<span class="go">' + ctaFor(it.tag) + "</span>";
  card.querySelector("h3").textContent = it.title; // 标题一律走 textContent，避免注入
  return card;
}

function makeGrid(items, showTag) {
  const grid = document.createElement("div");
  grid.className = "grid";
  for (const it of items) grid.appendChild(makeCard(it, showTag));
  return grid;
}

// 学习笔记按子类切分；未登记的标签统一落到「其他」
function noteGroups(items) {
  const buckets = new Map(NOTE_ORDER.map((t) => [t, []]));
  for (const it of items) {
    const key = buckets.has(it.tag) ? it.tag : "其他";
    buckets.get(key).push(it);
  }
  return NOTE_ORDER.filter((t) => buckets.get(t).length)
    .map((t) => ({ title: t, items: buckets.get(t) }));
}

function render(manifest) {
  const content = document.getElementById("content");
  content.innerHTML = "";
  const order = ["guide", "weekly", "note"];

  for (const cat of order) {
    const items = manifest.filter((i) => i.category === cat);
    if (!items.length) continue;

    const sec = document.createElement("section");
    const head = document.createElement("div");
    head.className = "sec-head";
    head.innerHTML =
      "<h2>" + SECTIONS[cat].title + "</h2>" +
      '<span class="count">' + items.length + " 份</span>";
    sec.appendChild(head);

    if (cat === "note") {
      for (const g of noteGroups(items)) {
        const sub = document.createElement("div");
        sub.className = "subhead";
        sub.innerHTML = "<h3></h3><span class=\"count\"></span>";
        sub.querySelector("h3").textContent = g.title;
        sub.querySelector(".count").textContent = g.items.length + " 篇";
        sec.appendChild(sub);
        sec.appendChild(makeGrid(g.items, false));
      }
    } else {
      sec.appendChild(makeGrid(items, true));
    }

    content.appendChild(sec);
  }
}

fetch("manifest.json")
  .then((r) => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(render)
  .catch((err) => {
    document.getElementById("content").innerHTML =
      '<div class="err">目录加载失败（' + err.message +
      "）。请通过 GitHub Pages 或本地 HTTP 服务器访问本页（直接双击本地文件时浏览器会拦截 fetch）。" +
      '也可前往 <a href="https://github.com/yhuang060122/WeeklyReview">仓库文件列表</a> 浏览。</div>';
  });
</script>
</body>
</html>
