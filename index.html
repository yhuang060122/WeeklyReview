<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeeklyReview 档案库</title>
<link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  :root {
    --bg: #0f1419;
    --bg-soft: #151b23;
    --card: #1a212b;
    --card-hover: #202a37;
    --border: #26303e;
    --text: #e8edf4;
    --text-dim: #9aa7b8;
    --accent: #2dd4bf;
    --accent-soft: #134e4a;
    --amber: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(45, 212, 191, 0.08), transparent 60%),
      radial-gradient(900px 400px at 10% -10%, rgba(245, 158, 11, 0.06), transparent 55%),
      var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 24px 40px; }

  header { margin-bottom: 40px; }
  header .kicker {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--accent);
    border: 1px solid var(--accent-soft);
    background: rgba(45, 212, 191, 0.08);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  header h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.02em; }
  header p.sub { margin-top: 10px; color: var(--text-dim); max-width: 680px; font-size: 15px; }

  section { margin-bottom: 40px; }
  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 20px;
  }
  .sec-head h2 { font-size: 19px; font-weight: 600; }
  .sec-head .count { font-size: 13px; color: var(--text-dim); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px 16px;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    background: var(--card-hover);
    border-color: rgba(45, 212, 191, 0.45);
  }
  .card .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tag {
    font-size: 12px;
    color: var(--accent);
    background: rgba(45, 212, 191, 0.10);
    border: 1px solid var(--accent-soft);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .tag.amber { color: var(--amber); background: rgba(245, 158, 11, 0.10); border-color: rgba(245, 158, 11, 0.30); }
  .date { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
  .card .go { font-size: 13px; color: var(--accent); font-weight: 500; }
  .card:hover .go::after { content: " →"; }

  .err {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 18px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .err a { color: var(--accent); }

  footer {
    border-top: 1px solid var(--border);
    padding-top: 18px;
    color: var(--text-dim);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    justify-content: space-between;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    .wrap { padding: 32px 16px 28px; }
    header h1 { font-size: 27px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="kicker">GITHUB PAGES · AUTOMATED</span>
    <h1>WeeklyReview 档案库</h1>
    <p class="sub">周复盘看板与学习笔记的静态档案。目录由 <code>manifest.json</code> 动态生成——推送新文件到 main 分支后，GitHub Actions 自动提取标题并重建本页。</p>
  </header>

  <main id="content"></main>

  <footer>
    <span>由 GitHub Actions 自动部署 · 目录自动生成，无需手工维护</span>
    <a href="https://github.com/yhuang060122/WeeklyReview">github.com/yhuang060122/WeeklyReview</a>
  </footer>

</div>

<script>
// 动态目录：读取构建时生成的 manifest.json，按分类渲染卡片
const SECTIONS = {
  guide:  { title: "📖 使用指南" },
  weekly: { title: "📊 周复盘系列" },
  note:   { title: "🧠 学习笔记" },
};

function tagClass(tag) {
  return (tag === "周复盘" || tag === "常驻模块") ? "tag" : "tag amber";
}

function ctaFor(tag) {
  if (tag === "周复盘" || tag === "常驻模块") return "打开看板";
  return tag === "使用指南" ? "查看指南" : "阅读笔记";
}

function render(manifest) {
  const content = document.getElementById("content");
  content.innerHTML = "";
  const order = ["guide", "weekly", "note"];

  for (const cat of order) {
    const items = manifest.filter((i) => i.category === cat);
    if (!items.length) continue;

    const sec = document.createElement("section");
    sec.innerHTML =
      '<div class="sec-head">' +
        "<h2>" + SECTIONS[cat].title + "</h2>" +
        '<span class="count">' + items.length + " 份</span>" +
      "</div>" +
      '<div class="grid"></div>';
    const grid = sec.querySelector(".grid");

    for (const it of items) {
      const card = document.createElement("a");
      card.className = "card";
      card.href = encodeURI(it.name);

      const dateHtml = it.label
        ? '<span class="date">' + it.label + "</span>"
        : "";

      card.innerHTML =
        '<div class="meta">' +
          '<span class="' + tagClass(it.tag) + '">' + it.tag + "</span>" +
          dateHtml +
        "</div>" +
        "<h3></h3>" +
        '<span class="go">' + ctaFor(it.tag) + "</span>";
      card.querySelector("h3").textContent = it.title; // 标题一律走 textContent，避免注入
      grid.appendChild(card);
    }
    content.appendChild(sec);
  }
}

fetch("manifest.json")
  .then((r) => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(render)
  .catch((err) => {
    document.getElementById("content").innerHTML =
      '<div class="err">目录加载失败（' + err.message +
      "）。请通过 GitHub Pages 或本地 HTTP 服务器访问本页（直接双击本地文件时浏览器会拦截 fetch）。" +
      '也可前往 <a href="https://github.com/yhuang060122/WeeklyReview">仓库文件列表</a> 浏览。</div>';
  });
</script>
</body>
</html>
